# Local development database. Credentials come from .env next to this file:
#   POSTGRES_PASSWORD=...   (required)
# Backend and frontend run on the host (npm run dev); tests use the dcagent_test database
# in the same container.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dcagent-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dcagent
      POSTGRES_USER: dcagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
